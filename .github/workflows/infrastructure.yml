name: Level 1 infrastructure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Install infrastructure validation dependencies
        run: python -m pip install -r requirements-ci.lock
      - name: Validate manifests, prompts, schemas, four provider catalogs and workspaces
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
